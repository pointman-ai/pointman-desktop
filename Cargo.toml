[package]
name = "desktop"
version = "0.1.0"
edition = "2021"
description = "agent-desktop on Pointman's machines: agents read and operate this machine's apps through the accessibility tree."
license = "MIT"
repository = "https://github.com/pointman-ai/pointman-desktop"
publish = false

[dependencies]
anyhow = "1"
base64 = "0.22"
flate2 = "1"
pointman-extension = { git = "https://github.com/pointman-ai/pointman-extension", tag = "v0.5.1" }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
ureq = "2"

[dev-dependencies]
tempfile = "3"
toml = "0.8"

[profile.release]
strip = true
lto = true
